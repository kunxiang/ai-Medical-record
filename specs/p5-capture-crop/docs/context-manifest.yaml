findings:
  - id: F1
    claim: >-
      供应商把每张图归一到固定 384 图像 token,长边 800/1024/2576 的 input_tokens 恒为 2002。
      像素预算是死的 ⇒ 裁掉背景是唯一还剩的提高每字符像素数的杠杆。
    evidence: specs/p0-p4-core/e2e-deployed-2026-08-30.md
  - id: F2
    claim: >-
      sharp 0.33.5 只有 affine/extract/rotate/resize/trim;affine 是 2×2 线性矩阵,
      做不了投影变换 ⇒ 轴对齐裁切零新增依赖,透视矫正强制引第二个图像库。
    evidence: 对已安装 sharp 的 prototype 实测(2026-08-31)
  - id: F3
    claim: >-
      @techstark/opencv-js@5 的 default 是 thenable,须 await;旧版的
      onRuntimeInitialized 回调永不触发,失败路径被 catch 吞掉后表现为"检测不到"。
    evidence: 部署实例浏览器实测;修复见 apps/web/src/offline/crop.ts
  - id: F4
    claim: >-
      检测精度:合成图上四角误差 < 5 px、面积占比误差 0.4%,耗时 54 ms(600×800 降采样)。
    evidence: specs/p0-p4-core/e2e-deployed-2026-08-31-crop.md
  - id: F5
    claim: >-
      模型输入体积**变大**(19→44 KiB),因为未裁那张多为平坦背景、压缩率高。
      "裁边顺带缩小跨境回拉体积"的预期不成立;8-30 的体积下降来自 maxEdge 2576→1024。
    evidence: specs/p0-p4-core/e2e-deployed-2026-08-31-crop.md

  - id: F6
    claim: >-
      部署实例于 2026-08-31 全量重置(owner 授权,既有数据确认为纯测试):桶清空 504 个
      版本/标记、schema 重建、20 个迁移从零重放通过。**副作用:8-30 的 6 份基准单据
      原件永久删除**,pg_dump 快照只含数据库行不含图像字节。
    evidence: scratchpad/amr-before-reset-20260831-0624.sql.gz(6 个 short_id 均可检出)

