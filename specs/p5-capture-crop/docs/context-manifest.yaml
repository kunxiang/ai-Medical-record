    then: >-
      先确认基准素材是否只存在于该实例。本任务的 M5 素材就是这样丢的 ——
      pg_dump 保住了数据库行,保不住 S3 里的图像字节。
  - if: 更换模型供应商
    then: >-
      DERIVATIVE_SPEC.ai 的 maxEdge 与本任务的收益假设(F1)都必须重测,
      不得沿用;注释已在 apps/api/src/derivatives.ts 标注。
  - if: 开放事后修改裁切(correction-NNNN.json 追加 crop_adjust)
    then: >-
      ensureDerivative 的 key 不编码 crop,会成为陈旧缓存;
      必须改为删除既有派生物或把 crop 摘要并入 key。
  - if: 升级或替换 @techstark/opencv-js
    then: 重新确认初始化契约(F3);crop.ts 的注释已写明不要退回 onRuntimeInitialized 写法。
